---
# Static marketing site only. Do not deploy workspace/application folders.
deployment:
  tasks:
    - |
      set -eu
      export DEPLOYPATH=/home/stylisee/public_html
      test -d "$DEPLOYPATH"
      for file in index.html favicon.png robots.txt sitemap.xml .htaccess; do
        test -f "$file"
      done
      for directory in assets pricing about contact privacy terms refund-policy cookie-policy data-processing security 404; do
        test -d "$directory"
      done
      if [ "$(pwd -P)" != "$(cd "$DEPLOYPATH" && pwd -P)" ]; then
        /bin/cp -R assets "$DEPLOYPATH/"
        /bin/cp -R pricing about contact privacy terms refund-policy cookie-policy data-processing security 404 "$DEPLOYPATH/"
        /bin/cp favicon.png robots.txt sitemap.xml "$DEPLOYPATH/"
        if [ ! -e "$DEPLOYPATH/.htaccess" ]; then
          /bin/cp .htaccess "$DEPLOYPATH/"
        fi
        /bin/cp index.html "$DEPLOYPATH/"
      fi
      echo "Stylisee website deployed to $DEPLOYPATH"
